name: Refresh production forecast

on:
  schedule:
    # 18:00 UTC = 03:00 KST (next day) — after the day's KBO games (and any extra
    # innings) have long finished.
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: npm test

      - name: Refresh data and rebuild landing page
        run: npm run refresh

      - name: Commit and push if changed
        run: |
          git config user.name "hanwha-now-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll docs/games-2026.js docs/badge.svg docs/share-card-story.svg docs/share-card-square.svg data/live/latest-report.json data/live/game-swings-2026.json data/live/box-scores-2026.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-refresh forecast $(date -u +%Y-%m-%d)"
            # Retry with rebase: an out-of-band push landing on master between our
            # checkout and this push (a manual push, or an overlapping run) rejects a
            # plain `git push` non-fast-forward, which previously just failed the whole
            # job and silently discarded this cycle's freshly-computed report.
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt $i/5) — rebasing onto origin/master and retrying"
              git pull --rebase origin master
            done
            echo "::error::failed to push auto-refresh commit after 5 attempts"
            exit 1
          fi
